<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spide POS - Dashboard</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ... styles ... */
    </style>
</head>
<body>
    <!-- ... dashboard content ... -->
    <script>
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/';
        }

        // Get token from cookie
        const token = getCookie('spide_token');
        const userCookie = getCookie('spide_user');
        const user = userCookie ? JSON.parse(userCookie) : {};

        // Redirect to login if no token
        if (!token) {
            window.location.href = '/login';
        }

        // ... rest of dashboard functions use token variable

        function logout() {
            deleteCookie('spide_token');
            deleteCookie('spide_user');
            deleteCookie('currentShopId');
            deleteCookie('currentShopName');
            window.location.href = '/login';
        }
    </script>
</body>
</html>
