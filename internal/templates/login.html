<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spide POS - Login</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .login-bg {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .spide-logo { font-size: 4rem; line-height: 1; display: block; text-align: center; }
        .input-field { transition: all 0.2s; }
        .input-field:focus { transform: scale(1.02); }
        .login-btn {
            background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%);
            transition: all 0.3s;
        }
        .login-btn:hover { transform: scale(1.02); box-shadow: 0 10px 25px -5px rgba(124,58,237,0.4); }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .hidden { display: none; }
        .success { color: #059669; background: #d1fae5; border: 1px solid #34d399; }
        .error { color: #dc2626; background: #fee2e2; border: 1px solid #f87171; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-bg">
        <div class="login-card">
            <div class="text-center">
                <img src="/favicon.ico" alt="Spide POS" class="w-20 h-20 mx-auto mb-2" onerror="this.style.display='none'; this.outerHTML='<span class=\'spide-logo\'>🕷️</span>'">
                <h1 class="text-3xl font-bold text-gray-800">Spide POS</h1>
                <p class="text-sm text-gray-500 mt-1">Point of Sale System</p>
            </div>

            <div id="message-container">
                <div id="message" class="hidden p-3 rounded-xl text-sm font-medium"></div>
            </div>

            <form id="loginForm" class="mt-8 space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required
                           class="input-field w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required
                           class="input-field w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition">
                </div>

                <button type="submit" id="loginBtn" class="login-btn w-full text-white font-bold py-3 rounded-xl text-lg transition flex items-center justify-center gap-2">
                    🚀 Login
                </button>
            </form>

            <div class="text-center text-xs text-gray-400 mt-4">
                <p>Demo: admin / admin123</p>
            </div>
        </div>
    </div>

    <script>
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'p-3 rounded-xl text-sm font-medium ' + type;
            msg.classList.remove('hidden');
        }

        function hideMessage() {
            document.getElementById('message').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('username').focus();
        });

        async function handleLogin(event) {
            event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            hideMessage();

            if (!username || !password) {
                showMessage('❌ Please enter both username and password', 'error');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Save to localStorage
                    localStorage.setItem('spide_token', data.token);
                    localStorage.setItem('spide_user', JSON.stringify(data.user));
                    localStorage.setItem('currentShopId', data.user.shop_id || 1);
                    localStorage.setItem('currentShopName', data.user.shop_name || 'Store #1 - Main');
                    
                    showMessage('✅ Login successful! Redirecting...', 'success');
                    
                    // Redirect based on role
                    setTimeout(function() {
                        if (data.user.role === 'director' || data.user.role === 'admin') {
                            window.location.href = '/director';
                        } else {
                            window.location.href = '/';
                        }
                    }, 500);
                } else {
                    showMessage('❌ ' + (data.error || 'Invalid username or password'), 'error');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '🚀 Login';
                }
            } catch (error) {
                showMessage('❌ Network error. Please try again.', 'error');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '🚀 Login';
                console.error('Login error:', error);
            }
        }

        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
