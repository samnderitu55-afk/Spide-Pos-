<!-- ============================================ -->
<!-- SUPPLIER MANAGEMENT MODAL -->
<!-- ============================================ -->
<div id="suppliers-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center border-b pb-3">
            <div>
                <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">👥 Manage Suppliers</h2>
                <p class="text-xs text-gray-500">View and manage your suppliers</p>
            </div>
            <button onclick="closeSuppliersModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">✕</button>
        </div>
        <div class="flex justify-end">
            <button onclick="openAddSupplierModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-bold px-4 py-2 rounded-lg transition flex items-center gap-2">➕ Add Supplier</button>
        </div>
        <div class="overflow-y-auto flex-1 border rounded-xl relative">
            <table class="w-full text-left border-collapse text-sm">
                <thead class="bg-gray-100 sticky top-0 border-b text-xs uppercase text-gray-600 z-10">
                    <tr>
                        <th class="p-3">Supplier Name</th>
                        <th class="p-3">Contact Person</th>
                        <th class="p-3">Phone</th>
                        <th class="p-3">Email</th>
                        <th class="p-3 text-center">Status</th>
                        <th class="p-3 text-center">Action</th>
                    </tr>
                </thead>
                <tbody id="suppliers-rows">
                    <tr><td colspan="6" class="p-4 text-center text-gray-500">Loading suppliers...</td></tr>
                </tbody>
            </table>
        </div>
        <div class="flex justify-end border-t pt-3">
            <button onclick="closeSuppliersModal()" class="bg-gray-200 text-gray-800 font-semibold px-5 py-2 rounded-xl hover:bg-gray-300 transition">Close</button>
        </div>
    </div>
</div>
