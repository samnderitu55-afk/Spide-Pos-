<!-- ============================================ -->
<!-- ADD SUPPLIER MODAL -->
<!-- ============================================ -->
<div id="add-supplier-modal" class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg border border-gray-100 transform transition-all">
        <div class="bg-purple-900 text-white px-6 py-4 rounded-t-2xl flex justify-between items-center">
            <h3 class="text-lg font-bold flex items-center gap-2">👤 Add New Supplier</h3>
            <button onclick="closeAddSupplierModal()" class="text-purple-200 hover:text-white hover:bg-purple-800 p-1 rounded-lg text-xl font-bold transition">✕</button>
        </div>
        <form id="supplierForm" onsubmit="saveSupplier(event)" class="p-6 space-y-4">
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Supplier Name *</label>
                <input type="text" id="supplierName" required placeholder="e.g. ABC Cosmetics Ltd" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none text-sm">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Contact Person</label>
                    <input type="text" id="supplierContact" placeholder="John Doe" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Phone</label>
                    <input type="text" id="supplierPhone" placeholder="+254 712 345 678" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none text-sm">
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Email</label>
                <input type="email" id="supplierEmail" placeholder="supplier@example.com" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Address</label>
                <textarea id="supplierAddress" rows="2" placeholder="Physical address..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none text-sm"></textarea>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-700 uppercase mb-1">Notes (Optional)</label>
                <textarea id="supplierNotes" rows="2" placeholder="Additional details..." class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-600 focus:border-transparent outline-none text-sm"></textarea>
            </div>
            <div id="supplierAlert" class="hidden p-3 rounded-lg text-sm font-medium"></div>
            <div class="flex justify-end gap-3 pt-4 border-t border-gray-100">
                <button type="button" onclick="closeAddSupplierModal()" class="px-4 py-2 text-sm font-semibold text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition">Cancel</button>
                <button type="submit" id="saveSupplierBtn" class="px-5 py-2 text-sm font-semibold text-white bg-purple-800 hover:bg-purple-700 rounded-lg shadow-md transition flex items-center gap-2">💾 Save Supplier</button>
            </div>
        </form>
    </div>
</div>
