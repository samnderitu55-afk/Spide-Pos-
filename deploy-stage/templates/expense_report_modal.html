<!-- ============================================ -->
<!-- EXPENSE REPORTS MODAL -->
<!-- ============================================ -->
<div id="expense-report-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-4xl rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center border-b pb-3">
            <div>
                <h2 class="text-xl font-bold text-gray-900 flex items-center gap-2">📊 Expense Reports</h2>
                <p class="text-xs text-gray-500">Track and analyze all business expenses</p>
            </div>
            <button onclick="closeExpenseReportModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">✕</button>
        </div>
        <div class="flex flex-wrap items-center gap-3 bg-gray-50 p-3 rounded-xl border">
            <div>
                <label class="text-xs font-bold text-gray-600 uppercase block">Start Date:</label>
                <input type="date" id="expense-report-start" class="border rounded-lg p-1.5 text-sm font-medium focus:ring-2 focus:ring-purple-500 focus:outline-none" />
            </div>
            <div>
                <label class="text-xs font-bold text-gray-600 uppercase block">End Date:</label>
                <input type="date" id="expense-report-end" class="border rounded-lg p-1.5 text-sm font-medium focus:ring-2 focus:ring-purple-500 focus:outline-none" />
            </div>
            <button onclick="fetchExpenseReport()" class="bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold px-4 py-2 rounded-lg transition">Generate Report</button>
        </div>
        <div id="expense-report-content" class="overflow-y-auto flex-1 border rounded-xl relative p-4">
            <div class="p-4 text-center text-gray-500">Select date range and click Generate.</div>
        </div>
        <div class="flex justify-between items-center border-t pt-3">
            <button onclick="printExpenseReport()" class="bg-gray-900 hover:bg-black text-white font-semibold px-5 py-2 rounded-xl transition flex items-center gap-2 text-sm">🖨️ Print Report</button>
            <button onclick="closeExpenseReportModal()" class="bg-gray-200 text-gray-800 font-semibold px-5 py-2 rounded-xl hover:bg-gray-300 transition">Close</button>
        </div>
    </div>
</div>
