<!-- ============================================ -->
<!-- PRODUCT SALES REPORT MODAL -->
<!-- ============================================ -->
<div id="product-report-modal" class="fixed inset-0 bg-black/60 hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-5xl rounded-2xl shadow-2xl p-6 space-y-4 max-h-[90vh] flex flex-col">
        <div class="flex justify-between items-center border-b pb-3">
            <div>
                <h2 class="text-xl font-bold text-gray-900">📈 Product Sales & Profitability Report</h2>
                <p class="text-xs text-gray-500">Track units sold, cost of goods, gross revenue, and net profit</p>
            </div>
            <button onclick="closeProductReportModal()" class="text-gray-400 hover:text-gray-600 font-bold text-xl">✕</button>
        </div>
        <div class="flex flex-wrap items-center gap-3 bg-gray-50 p-3 rounded-xl border">
            <div>
                <label class="text-xs font-bold text-gray-600 uppercase block">Start Date:</label>
                <input type="date" id="report-start-date" class="border rounded-lg p-1.5 text-sm font-medium focus:ring-2 focus:ring-purple-500 focus:outline-none" />
            </div>
            <div>
                <label class="text-xs font-bold text-gray-600 uppercase block">End Date:</label>
                <input type="date" id="report-end-date" class="border rounded-lg p-1.5 text-sm font-medium focus:ring-2 focus:ring-purple-500 focus:outline-none" />
            </div>
            <button onclick="fetchProductSalesReport()" class="bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold px-4 py-2 rounded-lg transition">Generate Report</button>
        </div>
        <div class="overflow-y-auto flex-1 border rounded-xl relative">
            <table class="w-full text-left border-collapse text-sm">
                <thead class="bg-gray-100 sticky top-0 border-b text-xs uppercase text-gray-600 z-10">
                    <tr>
                        <th class="p-3">Product Name</th>
                        <th class="p-3">Category</th>
                        <th class="p-3 text-center">Units Sold</th>
                        <th class="p-3 text-right">COGS (KES)</th>
                        <th class="p-3 text-right">Revenue (KES)</th>
                        <th class="p-3 text-right">Net Profit (KES)</th>
                        <th class="p-3 text-right">Margin %</th>
                    </tr>
                </thead>
                <tbody id="product-report-rows">
                    <tr><td colspan="7" class="p-4 text-center text-gray-500">Select date range and click Generate.</td></tr>
                </tbody>
                <tfoot id="product-report-footer" class="bg-purple-50 border-t-2 border-purple-200 sticky bottom-0 z-10 hidden"></tfoot>
            </table>
        </div>
        <div class="flex justify-between items-center border-t pt-3">
            <button onclick="printProductSalesReport()" class="bg-gray-900 hover:bg-black text-white font-semibold px-5 py-2 rounded-xl transition flex items-center gap-2 text-sm">🖨️ Print Sales Report</button>
            <button onclick="closeProductReportModal()" class="bg-gray-200 text-gray-800 font-semibold px-5 py-2 rounded-xl hover:bg-gray-300 transition">Close</button>
        </div>
    </div>
</div>
